summary: >-
  Uptake publishes no client SDK for its own platform API — there is no first-party
  library on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or
  crates.io that wraps api.uptake.com. What Uptake does publish, from its data-science
  team, is a set of general-purpose open-source packages under github.com/uptake
  (16 public repos), two of which are on CRAN and still maintained. They are recorded
  here as genuine first-party packages, flagged api_client:false so nothing reads
  them as an Uptake API SDK. NOTE on name collisions: pypi.org/project/numpynet,
  /updoc and /groundhog exist but belong to unrelated authors — Uptake's repos of
  those names were never published to PyPI. No `SDKs` pointer is wired in apis.yml,
  because none of these is a client for an Uptake API.
