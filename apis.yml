aid: uptake
name: Uptake
description: 'Uptake Technologies is a Chicago-based industrial AI and predictive-maintenance
  software company founded in 2014 by Eric Lefkofsky and Brad Keywell. Its SaaS platform
  ingests telematics, sensor, fluid-analysis and work-order data from heavy commercial
  fleets and industrial assets, then applies machine-learning failure models — backed
  by an Asset Strategy Library of roughly 800 equipment types and tens of thousands
  of failure modes acquired with Asset Performance Technologies in 2018 — to predict
  component failure before it happens. Products include Uptake Fleet and Radar (predictive
  maintenance alerts), Compass (work-order data cleansing), Fusion (operational-technology
  data to cloud) and Scout (rules-based alerting), delivered through the fleet.uptake.com
  web application, a Geotab Marketplace add-in, and a customer-provisioned REST API
  gateway at api.uptake.com. Bosch announced its acquisition of Uptake in March 2026.'
