apis:
- name: Uptake Platform API
  description: 'Uptake''s customer-provisioned REST API. The gateway is live at api.uptake.com
    (AWS API Gateway behind Cloudflare) and answers every anonymous request with HTTP
    403 ForbiddenException; a sibling gateway runs at api.common.uptake.com with identical
    behavior. Uptake''s Geotab Marketplace listing states that vehicle health status
    and impending-failure alerts are delivered through a dashboard, email, or via API
    to connect to a third party system, and integration partners such as Fleetio are
    instructed to hand their token to an Uptake account representative who completes
    the connection. No public OpenAPI, Swagger, GraphQL SDL, AsyncAPI or Postman collection
    is published anywhere on the uptake.com estate; the former developer portal at
    developer.uptake.com now returns nginx 404.'
  humanURL: https://uptake.com/fleet/
  baseURL: https://api.uptake.com/
